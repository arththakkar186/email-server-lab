# /etc/dovecot/conf.d/99-maillab.conf  -  mail.maillab.test
# Dovecot 2.3 (Ubuntu 20.04). Loaded last, so these values override the
# package defaults in conf.d/10-*.conf. Installed by provision/30-dovecot.sh.

# ---------------------------------------------------------------- protocols
protocols = imap pop3 lmtp
listen = *

# ---------------------------------------------------------------- mail storage
# One Maildir per system user: ~/Maildir/{cur,new,tmp} plus .Sent, .Drafts...
mail_location = maildir:~/Maildir
mail_privileged_group = mail
first_valid_uid = 1000

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
}

# ---------------------------------------------------------------- TLS
ssl = required
ssl_cert = </etc/ssl/maillab/mail.maillab.test.crt
ssl_key = </etc/ssl/maillab/mail.maillab.test.key
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes
ssl_dh = </usr/share/dovecot/dh.pem

# ---------------------------------------------------------------- authentication
# System accounts via PAM. Users log in as "alice" or "alice@maillab.test";
# %Ln strips the domain and lower-cases it so both forms, and LMTP deliveries
# to alice@maillab.test, map to the Unix user "alice".
disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_username_format = %Ln
auth_failure_delay = 2 secs

passdb {
  driver = pam
}
userdb {
  driver = passwd
}

# ---------------------------------------------------------------- listeners
# Plain-text 143/110 are disabled. Only implicit-TLS IMAPS 993 and POP3S 995.
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 0
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

# Postfix hands local mail to Dovecot here (main.cf: mailbox_transport).
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

# Postfix asks Dovecot to check SMTP AUTH passwords here (main.cf: smtpd_sasl_path).
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = dovecot
  }
}

protocol lmtp {
  postmaster_address = postmaster@maillab.test
}

protocol imap {
  mail_max_userip_connections = 20
}

# ---------------------------------------------------------------- logging
log_path = syslog
auth_verbose = yes
verbose_ssl = no
